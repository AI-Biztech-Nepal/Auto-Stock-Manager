# nginx site for the admin app at https://stock.hamroauto.com.np
#
# One-time setup on the VPS (needs sudo), after the DNS record  stock  A  203.134.250.70  exists:
#
#   sudo cp ~/auto-stock-manager/deploy/nginx-stock.conf /etc/nginx/sites-available/stock.hamroauto.com.np
#   sudo ln -s /etc/nginx/sites-available/stock.hamroauto.com.np /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d stock.hamroauto.com.np        # adds HTTPS and the http->https redirect
#   sudo chown -R mansa:mansa /var/www/auto-stock-frontend # so the deploy script can publish builds
#
# This only serves the already-built React app and passes /api to the backend on the same box, so
# the browser sees one origin (no CORS) and uploads go straight through. The 50 MB upload limit is
# the global client_max_body_size already set in /etc/nginx/nginx.conf.
server {
    listen 80;
    server_name stock.hamroauto.com.np;

    root /var/www/auto-stock-frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files have hashed names, so they can be cached for a year; index.html must never be
    # cached or people would keep opening an old version after a deploy.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: every other address is a screen inside the app.
    location / {
        try_files $uri /index.html;
    }
}
