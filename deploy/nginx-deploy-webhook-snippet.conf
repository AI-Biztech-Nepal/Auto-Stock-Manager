# Not a full nginx config -- one location block to add inside the existing 443 `server`
# block in /etc/nginx/sites-available/auto-stock-backend (the live one, not
# admin-web.nginx.conf in this same directory, which is a different app's reference
# copy). Add this above the existing `location / { ... }` block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kept here so it can be fetched directly on the VPS (curl from GitHub) instead of
# pasted through a terminal that mangles multi-line pastes -- see DEPLOYMENT.md.

    location /deploy-webhook {
        proxy_pass http://127.0.0.1:9002/deploy-webhook;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }
