server {
    server_name 203-134-250-70.sslip.io;

    location /deploy-webhook {
        proxy_pass http://127.0.0.1:9001/deploy-webhook;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    location /iclock/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }

    location = /auto-stock {
        return 301 /auto-stock/;
    }

    location /auto-stock/ {
        root /var/www;
        try_files $uri $uri/ /auto-stock/index.html;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/203-134-250-70.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/203-134-250-70.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name 203-134-250-70.sslip.io _;

    location /iclock/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
    }

    location = /auto-stock {
        return 301 /auto-stock/;
    }

    location /auto-stock/ {
        root /var/www;
        try_files $uri $uri/ /auto-stock/index.html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
