name: Keep Render backend alive

# Render's free tier spins the service down after 15 min of inactivity, causing
# a ~30s+ cold start on the next real request. Pinging /api/health well within
# that window keeps it warm. Runs independently of app code — cannot affect
# the site's behavior, only whether the backend is already awake when a real
# user hits it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 20 https://hamro-gng-auto-backend.onrender.com/api/health
