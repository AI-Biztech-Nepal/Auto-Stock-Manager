name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REACT_APP_BACKEND_URL: https://auto-stock-manager.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --network-timeout 300000

      - name: Build web app
        working-directory: frontend
        env:
          CI: false
        run: yarn build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        id: gradle
        working-directory: frontend/android
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}

      - name: Surface gradle failure as annotation
        if: steps.gradle.outcome == 'failure'
        run: |
          MSG=$(tail -c 900 /tmp/gradle.log | tr '\n' '|')
          echo "::error::GRADLE_FAILED: $MSG"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamro-gng-auto-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
