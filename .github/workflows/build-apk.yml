name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REACT_APP_BACKEND_URL: https://hamro-gng-auto-backend.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install frontend dependencies
        id: install
        working-directory: frontend
        continue-on-error: true
        run: |
          yarn install --network-timeout 300000 2>&1 | tee /tmp/yarn-install.log
          exit ${PIPESTATUS[0]}

      - name: Surface install failure as annotation
        if: steps.install.outcome == 'failure'
        run: |
          MSG=$(tail -c 900 /tmp/yarn-install.log | tr '\n' '|')
          echo "::error::INSTALL_FAILED: $MSG"
          exit 1

      - name: Build web app
        working-directory: frontend
        env:
          CI: false
        run: yarn build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamro-gng-auto-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
