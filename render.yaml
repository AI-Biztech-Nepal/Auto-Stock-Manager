services:
  - type: web
    name: hamro-gng-auto-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # DB_BACKEND=mysql switches the app to Hostinger MySQL (backend/sqldb.py)
      # instead of MongoDB Atlas. Leave unset/"mongo" until cutover is verified.
      - key: DB_BACKEND
        value: mongo
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: hamro_gng_auto
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: JWT_SECRET
        sync: false
      # Powers the AI Assistant (backend/server.py — genai.Client). Without this set,
      # /api/ai/* returns 503 "AI Assistant is not configured." Get a key at
      # aistudio.google.com/apikey.
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
